 [project]
name = "talkushka_service"
version = "2.2.11"
description = "telegram bot service that is capable of download audio/video/text by youtube video/channel link, part of talkushka ecosystem"
readme = "README.md"
authors = [{ name = "Sviatoslav Zaikin" }]

dependencies = [
    "yt_dlp[default]>=2026.2.4",
    "youtube-transcript-api>=1.2",
    "google-api-core>=2.29",
    "google-api-python-client>=2.190",
    "loguru==0.7.3",
    "aiohttp>=3.13",
    "aiogram>=3.25",
    "dropbox~=12.0",
    "setproctitle~=1.3",
    "python-dotenv",
    "pydantic~=2.12",
    "pydantic-settings~=2.13",
    "sqlalchemy>=2.0",
    "aiofiles",
    "grpclib",
    "betterproto[rust-codec]==2.0.0b7",
    "pyyaml",
    "asyncpg~=0.31",
    "greenlet>=3.3",
]
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "betterproto[compiler]==2.0.0b7",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio<0.25.0",
    "pytest-timeout",
]

[project.scripts]
talkushka-service = "talkushka_service.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "*.eggs",
    "build",
    "dist",
    "venv",
    "saved_files"
]


[tool.ruff.lint]
ignore = [
    "RUF001", # String contains ambiguous char
    "ANN204", # Missing return type annotation for special method `__del__`
    "T201", # `print` found
    "RUF003", # Comment contains smth
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "ANN003", # Missing type annotation for `**kwargs`
    "ANN002", # Missing type annotation for `*args`
    "ANN001", # Missing type annotation for function argument `self`
    "ANN206", # Missing return type annotation for classmethod
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "ISC001",
    "RUF006", # Store a reference to the return value of `asyncio.create_task`
]

extend-select = [
    "A", # flake8-builtins
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "C4", # comprehensions
    "E", "W", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "ICN",
    "INP",
    "ISC",
    "N", # pep8-naming
    "NPY",
    "PERF",
    "PIE", # flake8-pie
    "PL",
    "PT",
    "Q",
    "RET",
    "RUF",
    "S", # flake8-bandit
    "SIM", # simplify
    "T10",
    "T20", # flake8-print
    "PTH",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN201", "PLR2004", "INP001", "S105"]
"conftest.py" = ["S101", "ANN001", "ANN201"]
"src/talkushka_service/proto_gen/*" = ["RUF009", "F401", "UP035"]

[tool.uv]
required-version = ">=0.11.0"

[tool.pytest.ini_options]
addopts = '''
-s
-vv
--tb=long
--asyncio-mode=strict
'''
python_files = 'test_*.py'
filterwarnings = 'ignore::DeprecationWarning'
cache_dir = 'build/.pytest_cache_dir'
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio",
    "ffmpeg", # requires ffmpeg in OS installed
]
